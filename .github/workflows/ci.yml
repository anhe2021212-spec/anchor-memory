name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python scripts/verify_release_tree.py .
      - run: python scripts/verify_manifest.py .
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_live_contract.py tests/test_full_chain_contract.py

  projections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/verify_release_tree.py .
      - run: python scripts/verify_manifest.py .
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[server,chroma,kuzu,dev]"
      - run: python -m pytest tests/test_real_projections.py
      - run: python -m pytest tests/test_server_surface.py

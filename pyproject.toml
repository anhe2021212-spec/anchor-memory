[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-memory"
version = "0.2.0.dev0"
description = "A local-first graph memory and cognition pipeline for AI agents."
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Anchor Memory contributors" }]
dependencies = [
  "httpx>=0.27",
  "jieba>=0.42",
  "numpy>=1.26",
  "tomli>=2; python_version<'3.11'",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "mcp>=1.0"]
chroma = ["chromadb>=1.5.9,<2"]
kuzu = ["kuzu==0.11.3"]
local-embedding = ["sentence-transformers>=3"]
full = [
  "chromadb>=1.5.9,<2",
  "kuzu==0.11.3",
  "sentence-transformers>=3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "mcp>=1.0",
]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "anchor_db",
  "anchor_memory",
  "anchor_sse",
  "belief",
  "belief_graph",
  "cluster_raw",
  "cold_store",
  "context_compress",
  "dual_edge",
  "gateway",
  "integrate_v2",
  "maintenance",
  "model_routes",
  "propose_links",
  "recall_trace",
  "recall_v2",
  "reflex_router",
  "reflex_router_v2",
  "reflex_router_v2_runtime",
  "release_config",
  "run_dream_pass",
  "shadow_index",
  "taxonomy_tagger",
  "theseus_shadow_index",
  "time_utils",
  "update_review",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
